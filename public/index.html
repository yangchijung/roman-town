<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F6F2E9">
  <title>古羅馬城鎮｜Roman Town</title>
  <meta name="description" content="可步行探索的古羅馬城鎮地圖，準備中。">
  <style>
    :root { color-scheme: light; background: #f6f2e9; color: #29251f; font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 32px 24px; }
    main { width: min(100%, 680px); border-top: 6px solid #994d34; padding-top: 32px; }
    .eyebrow { font-size: 14px; letter-spacing: .16em; color: #994d34; margin: 0 0 16px; }
    h1 { font-family: Georgia, "Noto Serif TC", serif; font-size: clamp(36px, 7vw, 64px); line-height: 1.2; margin: 0 0 24px; }
    p { font-size: 18px; line-height: 1.8; max-width: 32em; }
    a { display: inline-flex; align-items: center; min-height: 48px; color: #793c29; text-underline-offset: 5px; }
    a:focus-visible { outline: 3px solid #994d34; outline-offset: 5px; }
    footer { margin-top: 64px; border-top: 1px solid #c9c0b1; padding-top: 16px; font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">ROMAN TOWN</p>
    <h1>古羅馬城鎮</h1>
    <p>走進街道、廣場與建築，漫遊古羅馬城鎮。</p>
    <p>地圖準備中，完成後將在這裡開放探索。</p>
    <a href="https://github.com/yangchijung/roman-town">查看專案進度</a>
    <footer>目前為專案準備頁。</footer>
  </main>
</body>
</html>
